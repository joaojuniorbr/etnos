name: Main CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: main-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUSKY: 0
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key:
            ${{ runner.os }}-node-22.14.0-modules-${{ hashFiles('yarn.lock',
            'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.14.0-modules-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key:
            ${{ runner.os }}-node-22.14.0-turbo-${{ github.ref_name }}-${{
            hashFiles('yarn.lock', 'turbo.json', 'package.json',
            'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.14.0-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-node-22.14.0-turbo-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --prefer-offline

      - name: Generate Prisma client
        run: yarn workspace api prisma:generate

      - name: Run affected validation on pull requests
        if: github.event_name == 'pull_request'
        run: yarn turbo run test check-types --affected

      - name: Run full validation on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: yarn turbo run test check-types

      - name: Upload coverage reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/**
            packages/*/coverage/**
          if-no-files-found: error

  chromatic:
    runs-on: ubuntu-latest
    needs: validate
    if: >
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      HUSKY: 0
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key:
            ${{ runner.os }}-node-22.14.0-modules-${{ hashFiles('yarn.lock',
            'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.14.0-modules-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key:
            ${{ runner.os }}-node-22.14.0-turbo-${{ github.ref_name }}-${{
            hashFiles('yarn.lock', 'turbo.json', 'package.json',
            'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.14.0-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-node-22.14.0-turbo-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --prefer-offline

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/docs

  sonarcloud:
    runs-on: ubuntu-latest
    needs: validate
    if: >
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      HUSKY: 0
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key:
            ${{ runner.os }}-node-22.14.0-modules-${{ hashFiles('yarn.lock',
            'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.14.0-modules-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key:
            ${{ runner.os }}-node-22.14.0-turbo-${{ github.ref_name }}-${{
            hashFiles('yarn.lock', 'turbo.json', 'package.json',
            'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.14.0-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-node-22.14.0-turbo-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --prefer-offline

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: .

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs:
      - chromatic
      - sonarcloud
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      HUSKY: 0
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key:
            ${{ runner.os }}-node-22.14.0-modules-${{ hashFiles('yarn.lock',
            'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.14.0-modules-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key:
            ${{ runner.os }}-node-22.14.0-turbo-${{ github.ref_name }}-${{
            hashFiles('yarn.lock', 'turbo.json', 'package.json',
            'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.14.0-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-node-22.14.0-turbo-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --prefer-offline

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn release
