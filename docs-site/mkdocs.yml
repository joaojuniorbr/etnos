site_name: Etnos
site_url: https://joaojuniorbr.github.io/etnos

theme:
  name: material
  language: pt-BR
  font:
    text: IBM Plex Sans
    code: Fira Code
  features:
    - navigation.expand
    - search.highlight
    - search.suggest

plugins:
  - search

nav:
  - Home: index.md
  - Fundamentação Pedagógica: fundamentacao.md
  - Arquitetura:
      - Autenticação: auth-architecture.md
      - Monorepo: monorepo-architecture.md
      - Pacotes compartilhados: packages-overview.md
      - Analytics (Mixpanel): analytics-architecture.md
      - App mobile: mobile-architecture.md
      - Mídia: media-architecture.md
      - Swagger: swagger.md
  - Jogos:
      - Arquitetura dos jogos: games-architecture.md
      - Jogos educacionais:
          - Adivinhe: guess-game.md
          - Jogo da memória: memory-game.md
  - Banco de Dados:
      - Arquitetura de dados: database-architecture.md
      - Modelagem: data-model.md
  - Qualidade:
      - Testes de performance: performance-tests.md
  - Entregas:
      - Relatório 2026:
          - Relatório Final 2026: relatorio-final-2026.md
          - Relatório Interdisciplinar 2026: relatorio-interdisciplinar-2026.md
          - Sprint 01: planejamento-sprint-1.md
          - Sprint 02: planejamento-sprint-2.md
          - Sprint 03: planejamento-sprint-3.md
          - Sprint 04: planejamento-sprint-4.md
          - Sprint 05: planejamento-sprint-5.md
          - Sprint 06: planejamento-sprint-6.md
      - 2025:
          - Entrega 01: 2025-p1.md
          - Entrega 02: 2025-p2.md
          - Wipex: 2025-wipex.md

site_dir: ../site
