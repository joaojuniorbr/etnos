site_name: Etnos
site_url: https://joaojuniorbr.github.io/etnos

theme:
  name: material
  language: pt-BR
  font:
    text: IBM Plex Sans
    code: Fira Code
  features:
    - navigation.expand
    - search.highlight
    - search.suggest

plugins:
  - search

nav:
  - Home: index.md
  - Arquitetura:
      - Monorepo: monorepo-architecture.md
      - Autenticação: auth-architecture.md
      - Mídia: media-architecture.md
      - Swagger: swagger.md
  - Jogos:
      - Jogos: games-architecture.md
  - Banco de Dados:
      - Banco de Dados: database-architecture.md
      - Modelagem: data-model.md
  - Entregas:
      - Planejamento 2026:
          - Sprint 01: planejamento-sprint-1.md
          - Sprint 02: planejamento-sprint-2.md

      - 2025:
          - Entrega 01: 2025-p1.md
          - Entrega 02: 2025-p2.md
          - Wipex: 2025-wipex.md

site_dir: ../site
